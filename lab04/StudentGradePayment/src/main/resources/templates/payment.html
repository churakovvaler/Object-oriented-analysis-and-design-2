<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Оплата</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="container">

    <h1>Оплата картой</h1>

    <h3 th:text="'Сумма: ' + ${price} + '$'">
    </h3>

    <form action="/pay" method="post">

        <!-- ДАННЫЕ СТУДЕНТА -->

        <input type="hidden"
               name="surname"
               th:value="${surname}">

        <input type="hidden"
               name="name"
               th:value="${name}">

        <input type="hidden"
               name="patronymic"
               th:value="${patronymic}">

        <input type="hidden"
               name="group"
               th:value="${group}">

        <!-- ДАННЫЕ ЗАКАЗА -->

        <input type="hidden"
               name="subject"
               th:value="${subject}">

        <input type="hidden"
               name="teacher"
               th:value="${teacher}">

        <input type="hidden"
               name="grade"
               th:value="${grade}">

        <input type="hidden"
               name="price"
               th:value="${price}">

        <!-- КАРТА -->

        <label>Номер карты</label>

        <input type="text"
               id="cardNumber"
               name="cardNumber"
               placeholder="1111 2222 3333 4444"
               maxlength="19"
               required>

        <label>Владелец карты</label>

        <input type="text"
               name="cardHolder"
               minlength="2"
               required>

        <label>CVV</label>

        <input type="password"
               name="cvv"
               pattern="[0-9]{3}"
               maxlength="3"
               placeholder="123"
               required>

        <button type="submit">
            Оплатить
        </button>

    </form>

</div>

<script>

    const cardInput =
        document.getElementById("cardNumber");

    cardInput.addEventListener(
        "input",
        function (e) {

            let value =
                e.target.value.replace(/\s/g, "");

            value =
                value.replace(/\D/g, "");

            if (value.length > 16) {

                value =
                    value.substring(0, 16);
            }

            value =
                value.match(/.{1,4}/g)?.join(" ")
                || "";

            e.target.value = value;
        }
    );

</script>

</body>

</html>
